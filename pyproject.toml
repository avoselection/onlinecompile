[project]
name = "onlinecompile"
version = "0.1.0"
description = "Collaborative online Python editor for educational sessions"
authors = [{ name = "avoselection" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "bcrypt>=4.1.3,<5.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
